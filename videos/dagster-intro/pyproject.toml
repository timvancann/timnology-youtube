[project]
name = "dagster_intro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9,<3.14"
dependencies = [
    "dagster",
    "dagster-cloud",
    "dagster-duckdb>=0.27.14",
    "dagster-duckdb-polars>=0.27.14",
    "dagster-snowflake-polars>=0.27.14",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver",
    "pytest",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.dagster]
module_name = "dagster_intro.definitions"
code_location_name = "dagster_intro"

[tool.setuptools.packages.find]
exclude=["dagster_intro_tests"]
